name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: tests
        run: python3 test/run.py --exe build/faloya
      - name: samples
        run: python3 samples/run_samples.py --exe build/faloya -j 4
      - name: cgen
        run: python3 test/cgen/run.py

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: extension
        run: |
          node --check vscode/src/extension.js
          for f in vscode/package.json vscode/language-configuration.json vscode/snippets/*.json vscode/syntaxes/*.json; do
            node -e "const o = JSON.parse(require('fs').readFileSync('$f')); if ('$f'.includes('tmLanguage')) { if (!o.scopeName || !o.patterns) process.exit(1); }"
          done
